# Optional overlay for GCS primary storage and/or file sharing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gcs.yml up -d --build
services:
  file-server:
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-credentials.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST to a credential file}:/run/secrets/gcp-credentials.json:ro
