# Deployment profile for the ipproxy host.
# This profile intentionally owns only file-server. PostgreSQL and the
# `services` Docker network are managed independently on the host.
services:
  file-server:
    image: ${VFS_LINK_IMAGE:?Set VFS_LINK_IMAGE to a content-addressed image reference}
    container_name: vfs-link-ipproxy
    restart: unless-stopped
    ports:
      - '21:21'
      - '${HTTP_PORT:-18080}:8080'
      - '${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30100}:${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30100}'
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the active ipproxy PostgreSQL database}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /data/objects

      FTP_ENABLED: ${FTP_ENABLED:-true}
      FTP_USER: ${FTP_USER:?Set FTP_USER}
      FTP_PASS: ${FTP_PASS:?Set FTP_PASS}
      FTP_PORT: 21
      FTP_PASV_URL: ${FTP_PASV_URL:?Set FTP_PASV_URL to the reachable FTP hostname}
      FTP_PASV_MIN: ${FTP_PASV_MIN:-30000}
      FTP_PASV_MAX: ${FTP_PASV_MAX:-30100}
      HTTP_PORT: 8080
      WEB_BASE_PATH: ${WEB_BASE_PATH:-/vfs-link/index}

      WEBDAV_ENABLED: ${WEBDAV_ENABLED:-false}
      WEBDAV_PATH: ${WEBDAV_PATH:-/dav/}
      WEBDAV_USER: ${WEBDAV_USER:-}
      WEBDAV_PASS: ${WEBDAV_PASS:-}
      WEBDAV_LOCK_TIMEOUT: ${WEBDAV_LOCK_TIMEOUT:-30m}
      WEBDAV_TRUST_FORWARDED_HEADERS: ${WEBDAV_TRUST_FORWARDED_HEADERS:-false}

      HTTP_BASIC_AUTH_ENABLED: ${HTTP_BASIC_AUTH_ENABLED:-false}
      HTTP_BASIC_AUTH_USER: ${HTTP_BASIC_AUTH_USER:-}
      HTTP_BASIC_AUTH_PASS: ${HTTP_BASIC_AUTH_PASS:-}
      HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS:-}

      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      DRIFT_ENABLED: ${DRIFT_ENABLED:-false}
      UPLOAD_SESSION_TTL: ${UPLOAD_SESSION_TTL:-24h}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-53687091200}

      SHARE_GCS_BUCKET: ${SHARE_GCS_BUCKET:-}
      SHARE_GCS_PREFIX: ${SHARE_GCS_PREFIX:-shares}
      SHARE_PUBLIC_BASE_URL: ${SHARE_PUBLIC_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PUB_SUB_DRIVER: ${PUB_SUB_DRIVER:-goroutine}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      PUB_SUB_TOPIC: ${PUB_SUB_TOPIC:-}
      PUB_SUB_PUSH_AUDIENCE: ${PUB_SUB_PUSH_AUDIENCE:-}
      PUB_SUB_PUSH_SERVICE_ACCOUNT: ${PUB_SUB_PUSH_SERVICE_ACCOUNT:-}
    volumes:
      - '${IPPROXY_RUNTIME_DIR:?Set IPPROXY_RUNTIME_DIR to /home/ipproxy/vfs-link-ipproxy}/data/objects:/data/objects'
    networks:
      - services
    healthcheck:
      # The production image is Alpine-based; BusyBox verifies that the HTTP
      # server has bound its port without requiring an unauthenticated endpoint.
      test: ['CMD', '/bin/busybox', 'nc', '-z', '127.0.0.1', '8080']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  services:
    name: ${IPPROXY_SERVICES_NETWORK:-services}
    external: true
