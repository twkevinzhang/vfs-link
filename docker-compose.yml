services:
  ftp-server:
    image: ${VFS_LINK_IMAGE:-vfs-link/ftp-server:local}
    build:
      context: .
      dockerfile: apps/ftp-server/Dockerfile
    restart: unless-stopped
    ports:
      - '21:21'
      - '${HTTP_PORT:-8080}:8080'
      - '${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30100}:${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30100}'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}?sslmode=disable
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - LOCAL_STORAGE_ROOT=/data/objects
      - GCS_BUCKET=${GCS_BUCKET:-}
      - FTP_USER=${FTP_USER:?Set FTP_USER}
      - FTP_PASS=${FTP_PASS:?Set FTP_PASS}
      - FTP_PORT=${FTP_PORT:-21}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - FTP_PASV_URL=${FTP_PASV_URL:?Set FTP_PASV_URL}
      - FTP_PASV_MIN=${FTP_PASV_MIN:-30000}
      - FTP_PASV_MAX=${FTP_PASV_MAX:-30100}
      - SHARE_GCS_BUCKET=${SHARE_GCS_BUCKET:-}
      - SHARE_GCS_PREFIX=${SHARE_GCS_PREFIX:-shares}
      - SHARE_PUBLIC_BASE_URL=${SHARE_PUBLIC_BASE_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - objectdata:/data/objects
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vfs-net

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vfs-net

volumes:
  pgdata:
  objectdata:

networks:
  vfs-net:
    driver: bridge
