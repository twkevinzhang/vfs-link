services:
  ftp-server:
    image: vfs-link/ftp-server:latest
    container_name: vfs-link
    ports:
      - '21:21'
      - '${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30005}:${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30005}'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/vfs_link?schema=public
      - FTP_USER=${FTP_USER:-admin}
      - FTP_PASS=${FTP_PASS:-admin123}
      - FTP_PORT=${FTP_PORT:-21}
      - FTP_PASV_URL=${FTP_PASV_URL:-127.0.0.1}
      - FTP_PASV_MIN=${FTP_PASV_MIN:-30000}
      - FTP_PASV_MAX=${FTP_PASV_MAX:-30005}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    volumes:
      - ./.auth/gcp-key.json:/app/gcp-key.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vfs-net

  db:
    image: postgres:15-alpine
    container_name: vfs-db
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vfs_link
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vfs-net

volumes:
  pgdata:

networks:
  vfs-net:
    driver: bridge
