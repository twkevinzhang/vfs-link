services:
  file-server:
    image: ${VFS_LINK_IMAGE:-vfs-link/file-server:local}
    build:
      context: .
      dockerfile: apps/file-server/Dockerfile
    restart: unless-stopped
    ports:
      - '21:21'
      - '${HTTP_PORT:-8080}:8080'
      - '${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30100}:${FTP_PASV_MIN:-30000}-${FTP_PASV_MAX:-30100}'
    environment:
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vfs_link:vfs_link@db:5432/vfs_link?sslmode=disable}
      - METADATA_STORAGE_DRIVER=${METADATA_STORAGE_DRIVER:-local}
      - METADATA_LOCAL_ROOT=/data/metadata
      - METADATA_GCS_BUCKET=${METADATA_GCS_BUCKET:-}
      - METADATA_PREFIX=${METADATA_PREFIX:-_vfs-link}
      - METADATA_SHARD_COUNT=${METADATA_SHARD_COUNT:-64}
      - METADATA_REDUCER_INTERVAL=${METADATA_REDUCER_INTERVAL:-2s}
      - METADATA_MUTATION_MODE=${METADATA_MUTATION_MODE:-global}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - LOCAL_STORAGE_ROOT=/data/objects
      - GCS_BUCKET=${GCS_BUCKET:-}
      - THUMBNAIL_STORAGE_DRIVER=${THUMBNAIL_STORAGE_DRIVER:-local}
      - THUMBNAIL_LOCAL_ROOT=/data/thumbnails
      - THUMBNAIL_GCS_BUCKET=${THUMBNAIL_GCS_BUCKET:-}
      - FTP_ENABLED=${FTP_ENABLED:-true}
      - FTP_USER=${FTP_USER:?Set FTP_USER}
      - FTP_PASS=${FTP_PASS:?Set FTP_PASS}
      - FTP_PORT=${FTP_PORT:-21}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - FTP_PASV_URL=${FTP_PASV_URL:?Set FTP_PASV_URL}
      - FTP_PASV_MIN=${FTP_PASV_MIN:-30000}
      - FTP_PASV_MAX=${FTP_PASV_MAX:-30100}
      - WEBDAV_ENABLED=${WEBDAV_ENABLED:-false}
      - WEBDAV_PATH=${WEBDAV_PATH:-/dav/}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASS=${WEBDAV_PASS:-}
      - WEBDAV_LOCK_TIMEOUT=${WEBDAV_LOCK_TIMEOUT:-30m}
      - WEBDAV_TRUST_FORWARDED_HEADERS=${WEBDAV_TRUST_FORWARDED_HEADERS:-false}
      - SHARE_GCS_BUCKET=${SHARE_GCS_BUCKET:-}
      - SHARE_GCS_PREFIX=${SHARE_GCS_PREFIX:-shares}
      - SHARE_PUBLIC_BASE_URL=${SHARE_PUBLIC_BASE_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - HTTP_BASIC_AUTH_ENABLED=${HTTP_BASIC_AUTH_ENABLED:-false}
      - HTTP_BASIC_AUTH_USER=${HTTP_BASIC_AUTH_USER:-}
      - HTTP_BASIC_AUTH_PASS=${HTTP_BASIC_AUTH_PASS:-}
      - HTTP_CORS_ORIGINS=${HTTP_CORS_ORIGINS:-*}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - UPLOAD_SESSION_TTL=${UPLOAD_SESSION_TTL:-24h}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-53687091200}
      - PUB_SUB_DRIVER=${PUB_SUB_DRIVER:-goroutine}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - PUB_SUB_TOPIC=${PUB_SUB_TOPIC:-}
      - PUB_SUB_PUSH_AUDIENCE=${PUB_SUB_PUSH_AUDIENCE:-}
      - PUB_SUB_PUSH_SERVICE_ACCOUNT=${PUB_SUB_PUSH_SERVICE_ACCOUNT:-}
    volumes:
      - objectdata:/data/objects
      - thumbnails:/data/thumbnails
      - metadata:/data/metadata
    networks:
      - vfs-net

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vfs_link}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vfs_link}
      - POSTGRES_DB=${POSTGRES_DB:-vfs_link}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vfs-net

volumes:
  pgdata:
  objectdata:
  thumbnails:
  metadata:

networks:
  vfs-net:
    driver: bridge
