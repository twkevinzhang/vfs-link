name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vfs-link-ci-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    name: Test, build, and publish
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: apps/ftp-server/go.sum
          cache: false

      - name: Test FTP server
        working-directory: apps/ftp-server
        run: ./scripts/go.sh test ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish FTP server image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vfs-link/ftp-server"
          docker build \
            --build-arg VITE_BASE_PATH=/vfs-link/index \
            --build-arg VITE_API_BASE_URL=/vfs-link \
            -f apps/ftp-server/Dockerfile \
            -t "$image:$GITHUB_SHA" \
            -t "$image:latest" \
            .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
