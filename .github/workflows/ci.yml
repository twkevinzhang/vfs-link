name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vfs-link-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: apps/ftp-server/go.sum
          cache: false

      - name: Test FTP server
        working-directory: apps/ftp-server
        run: ./scripts/go.sh test ./...

      - name: Build FTP server image
        run: |
          set -euo pipefail
          docker build \
            -f apps/ftp-server/Dockerfile \
            -t vfs-link/ftp-server:test \
            .
